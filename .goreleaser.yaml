# Release build for agentiscaled: a v* tag builds macOS and Linux
# binaries, .deb and .rpm packages, checksums, and a Homebrew cask.
# The release workflow publishes the draft and updates the tap after attestation.
version: 2
project_name: agentiscaled

builds:
  - id: agentiscaled
    main: ./cmd/agentiscaled
    binary: agentiscaled
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{ .Version }} -X main.commit={{ .FullCommit }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: agentiscaled
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - NOTICE
      - README.md

checksum:
  name_template: checksums.txt

nfpms:
  - id: packages
    package_name: agentiscaled
    # GitHub renames tildes in asset names. Normalize prerelease filenames
    # before GoReleaser writes the checksum manifest.
    file_name_template: '{{ replace .ConventionalFileName "~" "." }}'
    vendor: agentiscale
    homepage: https://github.com/whiteredhouse/agentiscaled
    maintainer: agentiscale <noreply@agentiscale.net>
    description: The agentiscale node. Joins your machine's agents to your private agentiscale network.
    license: Apache-2.0
    formats: [deb, rpm]
    bindir: /usr/bin
    contents:
      - src: LICENSE
        dst: /usr/share/doc/agentiscaled/LICENSE
      - src: NOTICE
        dst: /usr/share/doc/agentiscaled/NOTICE

homebrew_casks:
  - name: agentiscaled
    repository:
      owner: whiteredhouse
      name: homebrew-tap
    homepage: https://github.com/whiteredhouse/agentiscaled
    description: The agentiscale node. Joins your machine's agents to your private agentiscale network.
    license: Apache-2.0
    binaries: [agentiscaled]
    skip_upload: true
    hooks:
      post:
        # The binary is not notarized yet, so macOS would
        # refuse to run a quarantined download.
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/agentiscaled"]
          end

release:
  prerelease: auto
  draft: true
  use_existing_draft: true
  replace_existing_artifacts: true

changelog:
  use: github
