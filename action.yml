name: Join an agentiscale network
description: Join this job to your agentiscale network with GitHub's OIDC token, no stored secret, and run the node in the background.
author: agentiscale
branding:
  icon: share-2
  color: blue
inputs:
  network-id:
    description: ID of your network, shown in the console under your network's name. The network must trust this workflow.
    required: true
  version:
    description: Release of agentiscaled to install, like v0.12.0, or latest. Default is the release this action is pinned to, or latest when pinned to a branch or commit.
    required: false
    default: ""
  hostname:
    description: Name of this node in your network's member list.
    required: false
    default: github-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
  data-dir:
    description: Data directory of the node.
    required: false
    default: ${{ runner.temp }}/agentiscale
  control-url:
    description: URL of the agentiscale control service.
    required: false
    default: https://control.agentiscale.net
  timeout-seconds:
    description: How long to wait for the node to connect to the network.
    required: false
    default: "120"
outputs:
  data-dir:
    description: Data directory of the node; pass it as -data-dir to other agentiscaled commands.
    value: ${{ steps.join.outputs.data-dir }}
  peer-id:
    description: The node's peer ID in the network.
    value: ${{ steps.join.outputs.peer-id }}
  log:
    description: File the node logs to.
    value: ${{ steps.join.outputs.log }}
runs:
  using: composite
  steps:
    - id: join
      shell: bash
      env:
        AGENTISCALE_NETWORK: ${{ inputs.network-id }}
        AGENTISCALE_VERSION: ${{ inputs.version }}
        AGENTISCALE_ACTION_REF: ${{ github.action_ref }}
        AGENTISCALE_HOSTNAME: ${{ inputs.hostname }}
        AGENTISCALE_DATA_DIR: ${{ inputs.data-dir }}
        AGENTISCALE_CONTROL: ${{ inputs.control-url }}
        AGENTISCALE_TIMEOUT: ${{ inputs.timeout-seconds }}
      run: '"$GITHUB_ACTION_PATH/action/join.sh"'
