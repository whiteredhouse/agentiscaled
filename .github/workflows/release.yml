# A v* tag stages a draft and publishes it after verifying build provenance.
# The stable Homebrew cask is published by a separate, retryable job, and
# another starts the publish to pkgs.agentiscale.net's apt and yum repository.
# The container image is pushed under its version while staging; the latest
# and X.Y tags move to it only after a stable release is published.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release
  queue: max

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      packages: write
    outputs:
      publication-artifact-id: ${{ steps.inputs.outputs.artifact-id }}
      image-digest: ${{ steps.image.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check for an existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/publish-release.py check
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Test
        run: go test -race ./...
      # A multi-platform push needs a docker-container builder.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Stage release assets and generate cask
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.20.2
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        id: attest
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
            dist/checksums.txt
      - name: Find the image digest
        id: image
        run: |
          digest=$(jq -r '[.[] | select(.type == "Docker Image") | .extra.Digest] | unique | .[]' dist/artifacts.json)
          if ! [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Expected one image digest, got: $digest"
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/whiteredhouse/agentiscaled
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
      - name: Stage the attestation bundle for publication
        env:
          ATTESTATION_BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: cp "$ATTESTATION_BUNDLE" dist/provenance.json
      - name: Retain inputs for publication and retries
        id: inputs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-publication-${{ github.run_attempt }}
          path: |
            dist/checksums.txt
            dist/provenance.json
            dist/homebrew/Casks/agentiscaled.rb
          if-no-files-found: error

  publish:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      prerelease: ${{ steps.publish.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.release.outputs.publication-artifact-id }}
          path: release-inputs
      - name: Verify draft assets and publish
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/publish-release.py publish release-inputs/checksums.txt release-inputs/provenance.json

  homebrew:
    needs: [release, publish]
    if: needs.publish.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.release.outputs.publication-artifact-id }}
          path: release-inputs
      - name: Update the Homebrew tap
        env:
          GH_TOKEN: ${{ github.token }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: python3 .github/scripts/publish-release.py tap release-inputs/homebrew/Casks/agentiscaled.rb

  image-tags:
    needs: [release, publish]
    if: needs.publish.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Point latest and X.Y at the released image
        env:
          DIGEST: ${{ needs.release.outputs.image-digest }}
          TAG: ${{ github.ref_name }}
        run: |
          image=ghcr.io/whiteredhouse/agentiscaled
          version=${TAG#v}
          # The version tag must still name the image this run attested.
          [ "$(docker buildx imagetools inspect "$image:$version" --format '{{json .Manifest.Digest}}')" = "\"$DIGEST\"" ]
          # A rerun of an older release must not move a tag back: each tag
          # moves only if it is missing or names an older version.
          for alias in latest "${version%.*}"; do
            if raw=$(docker buildx imagetools inspect "$image:$alias" --raw 2>"$RUNNER_TEMP/inspect.err"); then
              current=$(jq -r '.annotations["org.opencontainers.image.version"] // empty' <<<"$raw")
              if [ -z "$current" ]; then
                echo "::error::$image:$alias has no version annotation"
                exit 1
              fi
            elif grep -q 'not found' "$RUNNER_TEMP/inspect.err"; then
              current=
            else
              cat "$RUNNER_TEMP/inspect.err" >&2
              exit 1
            fi
            if [ -n "$current" ] && [ "$(printf '%s\n' "$current" "$version" | sort -V | tail -n 1)" != "$version" ]; then
              echo "$image:$alias stays at $current, newer than $version"
              continue
            fi
            docker buildx imagetools create -t "$image:$alias" "$image@$DIGEST"
          done

  packages:
    needs: publish
    if: needs.publish.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    env:
      APP_CLIENT_ID: ${{ secrets.PACKAGES_APP_CLIENT_ID }}
      REPOSITORY: ${{ secrets.PACKAGES_DISPATCH_REPOSITORY }}
    steps:
      - name: Check configuration
        id: config
        run: |
          set -euo pipefail
          if [ -z "$APP_CLIENT_ID" ] || [ -z "$REPOSITORY" ]; then
            echo "PACKAGES_APP_CLIENT_ID or PACKAGES_DISPATCH_REPOSITORY is absent. Skipping packages."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"
          echo "owner=${REPOSITORY%%/*}" >> "$GITHUB_OUTPUT"
          echo "name=${REPOSITORY#*/}" >> "$GITHUB_OUTPUT"
      # A one-hour installation token that can only run workflows in the
      # publisher's repository; no long-lived token is stored here.
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        if: steps.config.outputs.enabled == 'true'
        id: token
        with:
          client-id: ${{ env.APP_CLIENT_ID }}
          private-key: ${{ secrets.PACKAGES_APP_PRIVATE_KEY }}
          owner: ${{ steps.config.outputs.owner }}
          repositories: ${{ steps.config.outputs.name }}
          permission-actions: write
      - name: Start the apt and yum repository publish
        if: steps.config.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh api -X POST "repos/$REPOSITORY/actions/workflows/packages.yml/dispatches" \
            -f ref=main -f "inputs[version]=$TAG"
