# A v* tag stages a draft and publishes it after verifying build provenance.
# The stable Homebrew cask is published by a separate, retryable job.
# The container image is pushed under its version while staging; the latest
# and X.Y tags move to it only after a stable release is published.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release
  queue: max

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      packages: write
    outputs:
      publication-artifact-id: ${{ steps.inputs.outputs.artifact-id }}
      image-digest: ${{ steps.image.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check for an existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/publish-release.py check
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: Test
        run: go test -race ./...
      # A multi-platform push needs a docker-container builder.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Stage release assets and generate cask
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          distribution: goreleaser
          version: v2.20.2
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        id: attest
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
            dist/checksums.txt
      - name: Find the image digest
        id: image
        run: |
          digest=$(jq -r '[.[] | select(.type == "Docker Image") | .extra.Digest] | unique | .[]' dist/artifacts.json)
          if ! [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Expected one image digest, got: $digest"
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-name: ghcr.io/whiteredhouse/agentiscaled
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
      - name: Stage the attestation bundle for publication
        env:
          ATTESTATION_BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: cp "$ATTESTATION_BUNDLE" dist/provenance.json
      - name: Retain inputs for publication and retries
        id: inputs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-publication-${{ github.run_attempt }}
          path: |
            dist/checksums.txt
            dist/provenance.json
            dist/homebrew/Casks/agentiscaled.rb
          if-no-files-found: error

  publish:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      prerelease: ${{ steps.publish.outputs.prerelease }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          artifact-ids: ${{ needs.release.outputs.publication-artifact-id }}
          path: release-inputs
      - name: Verify draft assets and publish
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/publish-release.py publish release-inputs/checksums.txt release-inputs/provenance.json

  homebrew:
    needs: [release, publish]
    if: needs.publish.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          artifact-ids: ${{ needs.release.outputs.publication-artifact-id }}
          path: release-inputs
      - name: Update the Homebrew tap
        env:
          GH_TOKEN: ${{ github.token }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: python3 .github/scripts/publish-release.py tap release-inputs/homebrew/Casks/agentiscaled.rb

  image-tags:
    needs: [release, publish]
    if: needs.publish.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Point latest and X.Y at the released image
        env:
          DIGEST: ${{ needs.release.outputs.image-digest }}
          TAG: ${{ github.ref_name }}
        run: |
          image=ghcr.io/whiteredhouse/agentiscaled
          version=${TAG#v}
          # The version tag must still name the image this run attested.
          [ "$(docker buildx imagetools inspect "$image:$version" --format '{{json .Manifest.Digest}}')" = "\"$DIGEST\"" ]
          docker buildx imagetools create -t "$image:latest" -t "$image:${version%.*}" "$image@$DIGEST"
