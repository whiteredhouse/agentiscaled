name: Release darwin/arm64

on:
  push:
    branches: [main]

permissions:
  contents: read
  attestations: read

jobs:
  observe:
    name: Release darwin/arm64
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/release-setup
      - name: Run native release acceptance
        id: verification
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SYSTEM: darwin
          RELEASE_ARCH: arm64
          RELEASE_DISCOVER: 'true'
        run: .venv-evidence/bin/python -I -m pytest -c qa/releases/pytest.ini --rootdir=. qa/releases --junitxml=reports/junit.xml --maxfail=1
      - name: Package verification evidence
        id: evidence
        if: always() && (steps.verification.outcome == 'success' || steps.verification.outcome == 'failure')
        env:
          EXACLY_TEST_OUTCOME: ${{ steps.verification.outcome }}
        run: .venv-evidence/bin/python -I -m exacly evidence package --report reports/junit.xml --out reports/evidence
      - name: Upload verification evidence
        if: always() && steps.evidence.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-darwin-arm64-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/evidence
          retention-days: 30
          if-no-files-found: error
          include-hidden-files: false
