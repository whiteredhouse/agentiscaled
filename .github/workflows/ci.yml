name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Format
        run: test -z "$(gofmt -l cmd third_party/agentmesh/export third_party/agentmesh/internal/controlplane/bound_peer*.go third_party/agentmesh/internal/node/local_a2a*.go third_party/agentmesh/internal/node/{labels_gate,mcp,node,sidecar}.go)"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...
      - name: Build the fork
        working-directory: third_party/agentmesh
        run: go build ./...
      - name: Test the fork's patches
        working-directory: third_party/agentmesh
        run: go test -race -run 'TestBootstrapTokenBoundToOnePeer|TestLocalA2A|TestLocalProvider' ./internal/controlplane/ ./internal/node/

  release-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --snapshot --clean
