name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Format
        run: test -z "$(gofmt -l cmd third_party/agentmesh/export third_party/agentmesh/internal/controlplane/bound_peer*.go)"
      - name: Vet
        run: go vet ./...
      - name: Prepare real Codex sandbox tests
        run: |
          # Match the user-namespace prerequisite used by openai/codex-action.
          for setting in kernel.unprivileged_userns_clone=1 kernel.apparmor_restrict_unprivileged_userns=0; do
            key=${setting%=*}
            desired=${setting#*=}
            current=$(sysctl -n "$key" 2>/dev/null || true)
            if [ -n "$current" ] && [ "$current" != "$desired" ]; then
              sudo sysctl -w "$setting"
            fi
          done
          archive="$RUNNER_TEMP/codex-test.tar.gz"
          install="$RUNNER_TEMP/codex-test"
          curl --fail --location --retry 3 --silent --show-error \
            https://github.com/openai/codex/releases/download/rust-v0.163.0/codex-package-x86_64-unknown-linux-musl.tar.gz \
            -o "$archive"
          printf '%s  %s\n' 582646c6bf0561eb0de540f7fc85b9121b0091a826bc6e96830b7f1722122182 "$archive" | sha256sum -c -
          mkdir -p "$install"
          tar -xzf "$archive" -C "$install"
          test -x "$install/codex-resources/bwrap"
          test "$("$install/bin/codex" --version)" = 'codex-cli 0.163.0'
          echo "AGENTISCALE_TEST_CODEX=$install/bin/codex" >> "$GITHUB_ENV"
      - name: Test
        run: go test -race ./...
      - name: Build the fork
        working-directory: third_party/agentmesh
        run: go build ./...
      - name: Test the fork's patch
        working-directory: third_party/agentmesh
        run: go test -race -run TestBootstrapTokenBoundToOnePeer ./internal/controlplane/

  release-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --snapshot --clean
