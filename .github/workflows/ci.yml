name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a pull request supersedes its running checks. Other events
# get a group of their own, so every push to main runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  vet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7.1.0
        with:
          go-version-file: go.mod
      - name: Format
        run: test -z "$(gofmt -l cmd)"
      - name: Vet
        run: go vet ./...

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7.1.0
        with:
          go-version-file: go.mod
      - name: Prepare real Codex sandbox tests
        run: |
          # Match the user-namespace prerequisite used by openai/codex-action.
          for setting in kernel.unprivileged_userns_clone=1 kernel.apparmor_restrict_unprivileged_userns=0; do
            key=${setting%=*}
            desired=${setting#*=}
            current=$(sysctl -n "$key" 2>/dev/null || true)
            if [ -n "$current" ] && [ "$current" != "$desired" ]; then
              sudo sysctl -w "$setting"
            fi
          done
          archive="$RUNNER_TEMP/codex-test.tar.gz"
          install="$RUNNER_TEMP/codex-test"
          curl --fail --location --retry 3 --silent --show-error \
            https://github.com/openai/codex/releases/download/rust-v0.163.0/codex-package-x86_64-unknown-linux-musl.tar.gz \
            -o "$archive"
          printf '%s  %s\n' 582646c6bf0561eb0de540f7fc85b9121b0091a826bc6e96830b7f1722122182 "$archive" | sha256sum -c -
          mkdir -p "$install"
          tar -xzf "$archive" -C "$install"
          test -x "$install/codex-resources/bwrap"
          test "$("$install/bin/codex" --version)" = 'codex-cli 0.163.0'
          echo "AGENTISCALE_TEST_CODEX=$install/bin/codex" >> "$GITHUB_ENV"
      - name: Test
        run: go test -race ./...

  test-agentmesh:
    # The Agent Mesh fork's patched packages, beside the main suite.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7.1.0
        with:
          go-version-file: go.mod
      - name: Test the Agent Mesh fork's patched packages
        run: |
          go mod download github.com/google/agentmesh
          mesh="$RUNNER_TEMP/agentmesh"
          cp -R "$(go list -m -f '{{.Replace.Dir}}' github.com/google/agentmesh)" "$mesh"
          chmod -R u+w "$mesh"
          cd "$mesh"
          go build ./...
          go test -race ./internal/controlplane ./internal/router ./internal/identity ./internal/node

  test-macos:
    # The Codex tests again on macOS, where Codex runs under Seatbelt
    # instead of bubblewrap.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7.1.0
        with:
          go-version-file: go.mod
      - name: Prepare real Codex sandbox tests
        run: |
          archive="$RUNNER_TEMP/codex-test.tar.gz"
          install="$RUNNER_TEMP/codex-test"
          curl --fail --location --retry 3 --silent --show-error \
            https://github.com/openai/codex/releases/download/rust-v0.163.0/codex-package-aarch64-apple-darwin.tar.gz \
            -o "$archive"
          printf '%s  %s\n' b0344fc2e41f15e0071147e5869008047b8ff4bf2c4a8897975d3bae3f103b34 "$archive" | shasum -a 256 -c -
          mkdir -p "$install"
          tar -xzf "$archive" -C "$install"
          test "$("$install/bin/codex" --version)" = 'codex-cli 0.163.0'
          echo "AGENTISCALE_TEST_CODEX=$install/bin/codex" >> "$GITHUB_ENV"
      - name: Test
        run: go test -race ./...

  install-script:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Check the script
        if: runner.os == 'Linux'
        run: shellcheck install.sh
      - name: Test install.sh
        env:
          INSTALL_TEST_LIVE: "1"
        run: python3 -I qa/install/test_install.py -v

  install-script-distros:
    # install.sh with each family's real package manager, against the real
    # releases: install, downgrade to a pin, the same pin again, a pin over
    # a replaced binary, and the upgrade back.
    strategy:
      fail-fast: false
      matrix:
        image:
          - debian:12
          - ubuntu:24.04
          - fedora:latest
          - rockylinux:9
          - opensuse/leap:15.6
          # yum 3, which exits 1 when it has nothing to do.
          - amazonlinux:2
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check the script
        run: shellcheck qa/install/distro-check.sh
      - name: Install in ${{ matrix.image }}
        env:
          IMAGE: ${{ matrix.image }}
        run: docker run --rm -v "$PWD:/src:ro" "$IMAGE" sh /src/qa/install/distro-check.sh

  release-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7.1.0
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: v2.20.2
          args: release --snapshot --clean
      - name: Run the container image
        run: |
          image=$(jq -r '.[] | select(.type == "Docker Image" and .extra.Platforms == ["linux/amd64"]) | .name' dist/artifacts.json)
          docker run --rm "$image" version | grep -q '^agentiscaled .*linux/amd64)$'
          [ "$(docker run --rm --entrypoint id "$image" -u)" = 65532 ]
